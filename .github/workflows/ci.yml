name: Test, build, and publish

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-ci-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-2
  ECR_REPOSITORY: loan-rag

jobs:
  test:
    name: Python quality gate
    runs-on: ubuntu-latest
    env:
      # Settings requires a syntactically valid DATABASE_URL at import time.
      # No live PostgreSQL is available in CI; tests that need the DB are
      # skipped by the _db_ready fixture when the connection is refused.
      DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project and test dependencies
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'
      - name: Test
        run: python -m pytest -q

  publish:
    name: Publish immutable image
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::288638162314:role/portfolio-github-actions-ecr-publisher
          aws-region: ${{ env.AWS_REGION }}
      - id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and publish commit plus release tags
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build --pull -t "$REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA" .
          docker tag "$REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA" "$REGISTRY/$ECR_REPOSITORY:latest"
          docker push "$REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA"
          docker push "$REGISTRY/$ECR_REPOSITORY:latest"
